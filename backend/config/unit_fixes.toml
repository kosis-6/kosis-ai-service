# 합쳐진 단위 고침표 (pipeline/load_raw.py가 적재할 때 읽는다). 2026-11-18
#
# KOSIS는 일부 표에서 항목 · 칸마다 다른 단위를 한 글자로 합쳐 모든 행에 준다.
# 예) DT_1B81A23: 출생아수 · 합계출산율 행 모두 UNIT_NM = "명 가임여자 1명당 명" (항목 메타의 단위는 비어 있음)
# 그대로 적재하면 "출생아수 640,089 가임여자 1명당 명"처럼 답에 틀린 단위가 붙는다.
#
# 적재할 때 단위가 아래 merged 중 하나인 행만 단위를 다시 정한다.
#   1. 그 표의 칸별 단위 ("T1" = 항목 코드, "c2:12" = 분류 2의 칸 12)
#   2. 칸 이름 끝 괄호의 단위 ("출생아수(명)" → 명). 괄호 안이 단위 낱말일 때만 ("일반혼인율(남편)"은 아님)
#   3. 그 표의 기본값 ("*")
#   4. 못 정하면 받은 그대로 두고 적재 기록에 경고
# 새로 합쳐진 단위가 보이면 merged와 표를 더한다. 적재된 724개 표에서 찾은 것은 아래 4개뿐이다 (11/18).

merged = [
  "명 건",
  "명 가임여자 1명당 명",
  "가임여자 1명당 명 해당 연령 여자인구 1천 명당 명",
  "(합계출산율) 가임여자 1명당 명 (연령별 출산율) 해당 연령 여자인구 1천 명당 명",
]

# 월.분기.연간 인구동향(출생,사망,혼인,이혼). 항목은 하나, 단위는 '종류별'(분류 2) 칸마다 다르다.
# 괄호에 단위가 있는 칸(출생아수(명), 조출생률(천명당), 혼인건수(건) …)은 괄호를 쓴다

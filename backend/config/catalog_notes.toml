# ---------------------------------------------------------------------------
# 지표 사전
#   method = "computed" : app/services/indicators.py 함수로 계산 (population 표 사용)
#   method = "lookup"   : facts 표에서 값을 그대로 꺼낸다 (app/services/lookup.py)
#   kind   : count(건수·인원) / ratio(%) / value(연령·율 등) / composition(구성비). 없으면 단위로 정함
#   desc   : 질문 이해 프롬프트에 지표 목록과 함께 보여줄 짧은 설명
#   national = false : 지역이 없을 때 전국으로 답하지 않고 지역을 묻는다 (예: 순이동은 전국 합이 0)
#
# sources: 지역 수준마다 쓸 표. 앞에 적은 표부터, 지역 수준·연도가 맞는 표를 고른다
#   level         : 전국 / 시도 / 시군구 (그 표로 답할 수 있는 가장 작은 지역 수준)
#   national_only : 지역 분류가 없는 전국 표 (INH_1B8000F_01)
#   item_id       : 항목 코드. 목록이면 더한다
#   filters       : 고정할 분류 코드. 값이 목록이면 더한다
#   den_item_id, den_filters : 있으면 (값 ÷ 분모) × 100 (분모 filters는 없으면 filters와 같음)
#   by_sex        : 성별마다 바꿀 칸 { "계" = {...}, "남" = {...}, "여" = {...} }. 계가 없으면 남녀를 따로 보여준다
#   age_dim       : 연령 분류 칸(c2/c3). age_total = 연령 합계 코드, age_min = 표의 최소 연령
#   parts_dim     : 구성비를 나눌 분류 칸. parts = { 이름 = [코드...] } (없으면 칸의 모든 값),
#                   parts_total = 분모(합계) 코드, leaf_only = 하위 분류가 있는 묶음 코드는 뺌
# ---------------------------------------------------------------------------


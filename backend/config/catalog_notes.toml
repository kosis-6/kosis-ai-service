# 통계표 설명서 (카탈로그 보강)
#
# 사람이 읽고 고치는 파일. src/catalog.py가 읽어서 kosis.duckdb에 넣는다.
#
#   [groups.*]      비교 그룹: 같은 그룹끼리만 값을 직접 비교할 수 있다 (답변 불가 사례 3)
#   [tables.*]      표마다 원래 조사 이름, 기준 시점, 대상, 비교 그룹
#   [[indicators]]  지표 사전: 질문 속 지표 이름 → 어느 표의 어느 항목인지
#
# verified = true  : KOSIS 통계표 주석·통계설명자료로 확인함
# verified = false : 초안(일반 지식 기반). 확인 후 true로 바꾼다
# check            : 아직 확인이 필요한 내용
# series_breaks    : 통계 기준이 바뀐 해. 그 해를 포함하는 추이에 주의사항을 붙인다
# region_notes     : 특정 지역(코드)에만 해당하는 주의사항. year가 있으면 그 해에만

# ---------------------------------------------------------------------------
# 비교 그룹
#   measure = "stock" : 특정 시점의 인구 수 (저량)
#   measure = "flow"  : 1년 동안 발생한 건수 (유량)
# ---------------------------------------------------------------------------

[groups.resident_registration]
name = "주민등록인구"
measure = "stock"
description = "주민등록 신고 기준 인구. 연도 값은 12월 말 시점"

[groups.census]
name = "인구총조사"
measure = "stock"
description = "행정자료 기반 인구총조사"

[groups.projection]
name = "장래인구추계"
measure = "stock"
description = "추계값(실적 아님). 7월 1일 기준, 국적과 상관없이 국내 상주 인구(외국인 포함)"

[groups.foreign_residents]
name = "지방자치단체 외국인주민 현황"
measure = "stock"
description = "행정안전부 외국인주민 통계. 11월 1일 기준. 외국인 + 귀화자 + 외국인주민 자녀"

[groups.vital_statistics]
name = "인구동향조사(출생·사망·혼인·이혼)"
measure = "flow"
description = "1년간 건수. 조출생률 등 율의 분모는 연앙인구"

[groups.vital_statistics_multicultural]
name = "다문화 인구동태"
measure = "flow"
description = "귀화·인지에 의한 국적취득자와 외국국적자가 포함된 다문화가족의 출생·혼인"

[groups.migration]
name = "국내인구이동통계"
measure = "flow"
description = "1년간 전입신고 기준 이동. 연간 통계는 연말 기준 행정구역으로 집계"

# 그룹이 달라도 직접 비교해도 되는 조합 (같은 신고 자료에서 나온 경우)
[[compatible_groups]]
groups = ["vital_statistics", "vital_statistics_multicultural"]
reason = "다문화 인구동태는 인구동향조사 신고 자료의 일부"

# ---------------------------------------------------------------------------
# 통계표
# ---------------------------------------------------------------------------


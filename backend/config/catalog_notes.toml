[tables.DT_1BPB002]
survey = "장래인구추계 시도편 (2022년 기준, 2024년 5월 공표)"
producer = "국가데이터처 (구 통계청)"
group = "projection"
reference_date = "각 연도 7월 1일"
scope = "국적과 상관없이 대한민국에 상주하는 인구 (외국인 포함)"
note = """1970~2022년은 확정인구, 2023년 이후는 추계값으로 다음 추계 때 바뀔 수 있음. \
시나리오: 중위(기본) = 출생·사망·이동 중위가정, 고위(최대인구) = 출생·사망·국제이동 고위 + 국내이동 중위, \
저위(최소인구) = 출생·사망·국제이동 저위 + 국내이동 중위, 무이동 = 출생·사망 중위 + 국제·국내이동 없음. \
용어: '인구구성비'는 전국 인구 중 해당 시도 인구의 비중(연령 구성이 아님). \
인구성장률 = ln(Pt/P0)/T × 100. 성비 = 남자/여자 × 100. 노령화지수 = 고령인구/유소년인구 × 100. \
유소년부양비 = 유소년인구/생산연령인구 × 100, 노년부양비 = 고령인구/생산연령인구 × 100"""
verified = true
region_notes = [
  { region = "27", description = "장래추계의 대구광역시에는 2023.7.1 편입된 군위군 인구가 포함되지 않음 (실적 통계의 대구와 범위가 다름)" },
  { region = "44", year = 2012, description = "2012년 충청남도 인구에는 세종시로 편입된 인구가 제외됨" },
  { region = "43", year = 2012, description = "2012년 충청북도 인구에는 세종시로 편입된 인구가 제외됨" },
]


(예: 2012 세종 소급 작성, 2014 청주·청원 통합은 연말 기준 청주시, 2023 군위군은 월간 합계와 연간이 다름). \
2026년 연간은 연말 기준 전남광주통합특별시, 인천 개편 후 행정구역으로 집계 예정"""

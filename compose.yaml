services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Windows 바인드 마운트에서는 파일 변경 이벤트가 전달되지 않아 폴링으로 감지
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kosis}
    volumes:
      - .:/app
      # 호스트(macOS/Windows)의 .venv가 컨테이너에서 깨진 인터프리터로 잡히지 않도록 가림
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-kosis}
    ports:
      # 내 PC에서만 접속 가능. 이미 5432를 쓰고 있으면 .env에서 POSTGRES_HOST_PORT 변경
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DB 최초 생성 시 한 번만 실행 (확장 설치)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

# 프로젝트 이름 고정: Dev Container로 열어도 같은 컨테이너·DB 볼륨(kosis-ai-service_pgdata)을 쓴다
name: kosis-ai-service

services:
  api:
    build:
      # 이미지에 backend/와 frontend/를 함께 넣으므로 컨텍스트는 레포 최상위
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Windows 바인드 마운트에서는 파일 변경 이벤트가 전달되지 않아 폴링으로 감지
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kosis}
    volumes:
      # 레포 전체를 마운트: frontend/ 서빙과 컨테이너 안 git(.git은 최상위)에 필요
      - .:/workspace
      # 호스트(macOS/Windows)의 .venv가 컨테이너에서 깨진 인터프리터로 잡히지 않도록 가림
      - /workspace/backend/.venv
    depends_on:
      db:
        condition: service_healthy
    # 개발용: 시작할 때 DB 구조를 최신으로 맞춘다. 운영에서는 배포 단계에서 한 번만 실행한다
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # 화면 빌드 (개발용): frontend/ 를 고칠 때마다 다시 빌드해 frontend/dist 에 쓴다.
  # api 가 그 폴더를 /chat 으로 서빙하므로 Node 를 깔지 않아도 docker compose up 만으로 화면이 뜬다.
  # 화면을 고치는 사람은 frontend/ 에서 npm run dev (5173, 바로 반영) 를 쓰면 더 빠르다
  frontend:
    image: node:22-slim
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
      # 호스트(macOS/Windows)의 node_modules 는 OS 가 달라 컨테이너에서 못 쓰므로 가린다
      - /workspace/frontend/node_modules
    command: sh -c "npm ci && npm run build:watch"

  # 통계표 적재 프로세스 (app.load_jobs 대기열 처리). 기본으로는 뜨지 않는다:
  #   docker compose --profile worker up -d worker
  # 받아 둔 표는 backend/data/tables/에 {표ID}.csv(.gz) + .meta.json으로 둔다
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kosis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kosis}
    volumes:
      - .:/workspace
      - /workspace/backend/.venv
    depends_on:
      db:
        condition: service_healthy
      # DB 구조(마이그레이션)는 api가 시작할 때 맞춘다
      api:
        condition: service_started
    restart: unless-stopped
    command: python -m pipeline.load_worker

  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-kosis}
    ports:
      # 내 PC에서만 접속 가능. 이미 5432를 쓰고 있으면 .env에서 POSTGRES_HOST_PORT 변경
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DB 최초 생성 시 한 번만 실행 (확장 설치)
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
